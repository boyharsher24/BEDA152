# TASK 12/13 - build + push the raskur image to ECR  (book: "Automating the deployment / Docker")
name: docker-raskur

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/**'

env:
  WORKING_DIRECTORY: ./app
  AWS_REGION: eu-central-1
  TERRAFORM_VERSION: '1.5.7'   # be specific, per the book

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: image-version
        name: Generate Version Number
        run: echo "version=$(date +'%Y.%m').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # TODO: configure-aws-credentials (aws-actions/configure-aws-credentials@v4) using
